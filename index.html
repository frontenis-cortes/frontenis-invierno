<style>
:root{
  --g-900:#0f2a1a; --g-800:#17402a; --g-700:#1f5535; --g-600:#2a6b45;
  --yellow:#f2c618; --yellow-ink:#2a2200; --red-line:#c8282b;
  --paper:#f1f3ee; --card:#ffffff; --ink:#14201a; --muted:#5d6b62; --line:#dde3dc;
  --green:#1f9d63; --green-bg:#e3f6ec; --star-bg:#fff3d1;
  --red:#cf3b4b; --red-bg:#fde8eb; --blue-bg:#e8f0ff;
  --shadow:0 1px 2px rgba(15,42,26,.06),0 8px 24px rgba(15,42,26,.08);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
.wrap.wide{max-width:1040px}

/* ---------- Cabecera ---------- */
.hero{color:#fff;border-top:5px solid var(--red-line);border-bottom:5px solid var(--red-line);
  background:radial-gradient(900px 340px at 90% -20%,rgba(242,198,24,.16),transparent 60%),linear-gradient(180deg,#123420 0%,#17402a 70%,#0f2a1a 100%)}
.hero-inner{padding-top:18px;padding-bottom:18px}
.kicker{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.kicker .y{color:var(--yellow)}
.hero h1{margin:12px 0 2px;font-size:clamp(15px,4vw,20px);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.hero h1 b{color:var(--yellow)}
.hero .big{font-size:clamp(40px,12vw,76px);line-height:.95;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
.hero .season{display:flex;align-items:center;gap:12px;margin-top:4px;color:var(--yellow);font-weight:800;font-size:clamp(22px,6vw,34px);text-transform:uppercase;letter-spacing:.04em}
.hero .season i{flex:1;height:2px;background:var(--yellow);opacity:.8}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
@media (max-width:620px){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{background:rgba(0,0,0,.28);border-radius:10px;padding:9px 11px}
.fact small{display:block;color:var(--yellow);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.fact b{display:block;font-size:17px;margin-top:2px;line-height:1.15}
.fact span{font-size:12.5px;opacity:.85}
.hero-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#06351b;border:0;border-radius:999px;padding:10px 16px;font-weight:700;text-decoration:none;font-size:14px}
.btn-wa svg{width:18px;height:18px}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px}
.poster{display:none;margin-top:14px;text-align:center}
.poster.show{display:block}
.poster img{max-width:100%;max-height:82vh;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- Pestañas (solo organización) ---------- */
.tabs-bar{position:sticky;top:0;z-index:20;background:rgba(241,243,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-bar[hidden]{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--g-800);color:#fff}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--star-bg);color:var(--ink);font-size:12px;line-height:20px;text-align:center}

main{padding:18px 0 40px}
section[hidden]{display:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:19px}
.card h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45}
.banner{border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
.banner.warn{background:var(--star-bg);color:#5c3f08;border:1px solid #f0d58a}
.banner.err{background:var(--red-bg);color:#7a1d2a;border:1px solid #f3b5bf}
.banner.info{background:var(--blue-bg);color:#13306b;border:1px solid #c7d8fb}
.banner.demo{background:#2b1a5c;color:#fff}

/* ---------- Formulario ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field .hint{font-weight:400;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
input[type=text],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;outline:none;transition:border-color .15s}
select{width:auto;padding:9px 10px;appearance:auto}
input:focus,textarea:focus,select:focus{border-color:var(--g-600)}
textarea{min-height:76px;resize:vertical}
.err-msg{color:var(--red);font-size:13px;margin-top:6px;display:none}
.invalid > .err-msg{display:block}
.field.invalid input{border-color:var(--red)}
.form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mine{display:flex;flex-direction:column;gap:8px}
.mine-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--green);background:#f6fcf8;border-radius:12px;padding:10px 12px}
.mine-item b{font-size:15px}
.mine-item small{display:block;color:var(--muted)}

.day{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.day.invalid{border-color:var(--red)}
.day-head{margin-bottom:10px}
.day-name{font-weight:800;font-size:17px}
.day-date{color:var(--muted);font-weight:500;margin-left:6px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-weight:600;font-size:15px;width:100%}
.opt i{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid #b9c3bb;display:inline-block;position:relative}
.opt[aria-pressed="true"]{border-color:var(--g-700);background:#f3f8f4}
.opt[aria-pressed="true"] i{border-color:var(--g-700)}
.opt[aria-pressed="true"] i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--g-700)}
.opt.no[aria-pressed="true"]{border-color:var(--red);background:var(--red-bg)}
.opt.no[aria-pressed="true"] i{border-color:var(--red)}
.opt.no[aria-pressed="true"] i::after{background:var(--red)}
.limits{margin-top:10px;padding:12px;border-radius:10px;background:var(--paper)}
.lim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:15px}
.lim .x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.lim-err{flex-basis:100%;color:var(--red);font-size:13px;font-weight:500}
.add{border:1.5px dashed #b9c3bb;background:#fff;border-radius:9px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--g-700)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:15px}
.btn.primary{background:var(--g-800);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:#fff;border:1.5px solid #f3b5bf;color:var(--red)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{cursor:not-allowed;opacity:.55}

.done{text-align:center;padding:26px 18px}
.done .bigicon{font-size:44px;line-height:1}
.done h2{margin:10px 0 6px;font-size:22px}
.linkbox{display:flex;gap:8px;margin:14px auto 6px;max-width:560px}
.linkbox input{font-size:14px;color:var(--muted)}
.done .actions{justify-content:center}

/* ---------- Organización ---------- */
.progress{height:10px;background:#e3e8e1;border-radius:999px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s}
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:14px;line-height:1.35}
.li .no{flex:0 0 30px;height:30px;border-radius:8px;background:#eef0ec;color:var(--muted);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.li.ok .no{background:var(--green);color:#fff}
.li small{display:block;color:var(--muted)}
.ok-t{color:var(--green);font-weight:700}
.x-t{color:var(--red);font-weight:700}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.covday{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.covday h4{margin:0 0 8px;font-size:15px}
.bar{display:grid;grid-template-columns:48px 1fr 28px;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
.bar .t{color:var(--muted);font-variant-numeric:tabular-nums}
.bar .b{height:14px;background:#eef0ec;border-radius:4px;overflow:hidden}
.bar .b i{display:block;height:100%;border-radius:4px}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.rcard{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.rcard .n{font-weight:700;font-size:15px;line-height:1.3}
.rcard .d{margin-top:6px;font-size:13.5px;line-height:1.45}
.rcard .meta{margin-top:6px;font-size:12px;color:var(--muted)}
.rcard .notes{margin-top:8px;font-size:13px;background:var(--paper);border-radius:8px;padding:7px 9px;white-space:pre-wrap}
.rcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef0ec;color:var(--muted);margin-top:6px}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.warn{background:var(--star-bg);color:#5c3f08}
.h3{margin:22px 0 10px;font-size:16px}
.cfg-day{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfa}
.cfg-day .row4{display:grid;grid-template-columns:1fr 1fr 110px 110px auto;gap:8px;align-items:end}
@media (max-width:680px){.cfg-day .row4{grid-template-columns:1fr 1fr}.cfg-day .row4 .btn{grid-column:1/-1}}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:22px;height:22px}

/* ---------- Pie, modales, aviso ---------- */
footer{text-align:center;padding:10px 16px 40px;color:var(--muted);font-size:13px}
footer .lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px}
.overlay{position:fixed;inset:0;background:rgba(15,42,26,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal p{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 14px}
.modal .actions{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--g-900);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa6a0}
.status-dot.on{background:#38d98a}
.status-dot.off{background:#ff7b8a}
</style>
</head>

function fmtTs(ts){ if(!ts) return ""; const d = new Date(ts); return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}) + " " + d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}); }

function wa(text){ return "https://wa.me/?text=" + encodeURIComponent(text); }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("sin respuesta del servidor; revisa la conexión")), ms))]); }
function errText(e){ return e && e.code === "PERMISSION_DENIED" ? "la base de datos lo ha rechazado" : (e && e.message) || String(e); }
let toastT;
function toast(msg, err){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(()=> t.className = "toast", err ? 6000 : 2800); }

/* Horas: "HH:MM" ↔ minutos desde el inicio del día de juego (las de madrugada siguen contando: 01:00 = 25:00) */
const toMin = s => { const [h,m] = String(s).split(":").map(Number); return h*60 + (m||0); };
const fromMin = n => { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n/60)).padStart(2,"0") + ":" + String(n%60).padStart(2,"0"); };
function dayRange(d){ const a = toMin(d.desde || "00:00"); let b = toMin(d.hasta || "00:00"); if(b <= a) b += 1440; return [a, b]; }
function abs(d, hhmm){ const [a] = dayRange(d); let t = toMin(hhmm); if(t < a) t += 1440; return t; }
function hourOptions(d){ const [a,b] = dayRange(d), out = []; for(let t = a; t <= b; t += STEP) out.push(fromMin(t)); return out; }

/* ======================= Datos: Firebase o modo prueba ======================= */
/* Público: leer config, crear una respuesta, y leer/cambiar/borrar la suya por su id (el id va en su enlace).
   Organización (con Google): leer todas las respuestas y el listado, y cambiar la config. */
function makeFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.database(), root = db.ref(DB_ROOT), auth = firebase.auth();
  let subs = [];
  return {
    onConfig(cb, err){ root.child("config").on("value", s => cb(s.val()), err); },
    onConnected(cb){ db.ref(".info/connected").on("value", s => cb(!!s.val())); },
    async getRespuesta(id){ return (await root.child("respuestas/" + id).once("value")).val(); },
    async saveRespuesta(id, data){ if(id){ await root.child("respuestas/" + id).set(data); return id; } const r = root.child("respuestas").push(); await r.set(data); return r.key; },
    deleteRespuesta(id){ return root.child("respuestas/" + id).remove(); },
    saveConfig(c){ return root.child("config").set(c); },
    onAuth(cb){ auth.onAuthStateChanged(u => cb(u ? { email:(u.email || "").toLowerCase() } : null)); },
    async login(){
      const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt:"select_account" });
      try{ await auth.signInWithPopup(p); }
      catch(e){ if(e && /popup/.test(e.code || "")) await auth.signInWithRedirect(p); else throw e; }
    },
    logout(){ return auth.signOut(); },
    watchOrg(onR, onP, err){
      const r = root.child("respuestas"), p = root.child("parejas");
      r.on("value", s => onR(s.val() || {}), err); p.on("value", s => onP(s.val() || {}), err);
      subs = [r, p];
    },
    unwatchOrg(){ subs.forEach(x => x.off()); subs = []; }
  };
}
function makeLocal(){
  const read = () => lsGet(LS_DEMO, { config:null, respuestas:{}, parejas:{
    p01:{num:1,j1:"Ana Prueba",j2:"Bea Ejemplo"}, p02:{num:2,j1:"Carlos Demo",j2:"Dani Ficticio",cabeza:1}, p03:{num:3,j1:"Eva Muestra",j2:"Fer Inventado"} } });
  let cfgCb = null, orgCbs = null, authCb = null;
  const emit = () => { const d = read(); if(cfgCb) cfgCb(d.config); if(orgCbs){ orgCbs[0](d.respuestas || {}); orgCbs[1](d.parejas || {}); } };
  const write = fn => { const d = read(); fn(d); lsSet(LS_DEMO, d); setTimeout(emit, 0); };
  window.addEventListener("storage", e => { if(e.key === LS_DEMO) emit(); });
  return {
    onConfig(cb){ cfgCb = cb; setTimeout(() => cb(read().config), 0); },
    onConnected(cb){ cb(true); },
    async getRespuesta(id){ return (read().respuestas || {})[id] || null; },
    async saveRespuesta(id, data){ const k = id || uid("-demo"); write(d => { d.respuestas = d.respuestas || {}; d.respuestas[k] = data; }); return k; },
    async deleteRespuesta(id){ write(d => { if(d.respuestas) delete d.respuestas[id]; }); },
    async saveConfig(c){ write(d => { d.config = c; }); },
    onAuth(cb){ authCb = cb; setTimeout(() => cb(ssGet(SS_DEMO_ORG) ? { email:ORG_EMAILS[0] } : null), 0); },
    async login(){ ssSet(SS_DEMO_ORG, "1"); authCb({ email:ORG_EMAILS[0] }); },
    async logout(){ ssSet(SS_DEMO_ORG, null); authCb(null); },
    watchOrg(onR, onP){ orgCbs = [onR, onP]; setTimeout(emit, 0); },
    unwatchOrg(){ orgCbs = null; }
  };
}
function fillConfig(c){
  const base = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if(!c) return base;
  const out = Object.assign(base, c);
  out.dias = (Array.isArray(c.dias) ? c.dias : []).filter(Boolean).filter(d => d.desde && d.hasta)
    .map(d => ({ id:d.id, nombre:d.nombre || "", fecha:d.fecha || "", desde:d.desde, hasta:d.hasta }));
  if(!out.dias.length) out.dias = base.dias.length ? JSON.parse(JSON.stringify(DEFAULT_CONFIG.dias)) : [];
  return out;
}

function mineIds(){ return lsGet(LS_MINE, []); }
function addMine(id){ const m = mineIds().filter(x => x !== id); m.unshift(id); lsSet(LS_MINE, m.slice(0,5)); }
function delMine(id){ lsSet(LS_MINE, mineIds().filter(x => x !== id)); delete S.mine[id]; }
function isOpen(){ const c = S.config; if(c.abierta === false) return false; if(c.fechaLimite && todayIso() > c.fechaLimite) return false; return true; }
function canEdit(){ return isOpen() || S.org; }
function names(p){ return `${p.j1 || "?"} – ${p.j2 || "?"}`; }
function limitsOf(r, d){ const x = ((r && r.dias) || {})[d.id]; return x && Array.isArray(x.no) ? x.no.filter(Boolean) : (x && x.no ? Object.values(x.no) : []); }
function modeOf(r, d){ const x = ((r && r.dias) || {})[d.id]; return x ? x.modo : ""; }
/* ¿Puede la pareja jugar a esa hora (en minutos absolutos del día)? */
function canPlay(r, d, t){ const m = modeOf(r, d); if(m === "todo") return true; if(m !== "limites") return false; return !limitsOf(r, d).some(l => t >= abs(d, l.de) && t < abs(d, l.a)); }
function dayText(r, d){
  const m = modeOf(r, d);
  if(m === "todo") return "cualquier hora";
  if(m === "nada") return "no puede";
  if(m === "limites") return "no " + limitsOf(r, d).map(l => `${l.de}–${l.a}`).join(", ");
  return "sin responder";
}

function dayHtml(d, dis){
  const st = S.form.dias[d.id] || { modo:"", no:[] }, opts = hourOptions(d);
  const sel = (val, k, i) => `<select data-day="${esc(d.id)}" data-i="${i}" data-k="${k}" ${dis}>${opts.map(o => `<option${o === val ? " selected" : ""}>${o}</option>`).join("")}</select>`;
  const opt = (modo, txt, cls) => `<button type="button" class="opt ${cls || ""}" data-day="${esc(d.id)}" data-modo="${modo}" aria-pressed="${st.modo === modo}" ${dis}><i></i>${txt}</button>`;
  let h = `<div class="day" id="day-${esc(d.id)}"><div class="day-head"><span class="day-name">${esc(d.nombre)}</span><span class="day-date">${esc(d.fecha)} · de ${esc(d.desde)} a ${esc(d.hasta)}</span></div>
    <div class="opts">${opt("todo", "Podemos a cualquier hora")}${opt("limites", "Hay horas que no podemos")}${opt("nada", `No podemos en todo el ${esc(d.nombre.toLowerCase())}`, "no")}</div>`;
  if(st.modo === "limites"){
    h += `<div class="limits">` + st.no.map((l, i) => `<div class="lim">No podemos de ${sel(l.de, "de", i)} a ${sel(l.a, "a", i)}
        <button type="button" class="x" data-rm="${esc(d.id)}" data-i="${i}" aria-label="Quitar" ${dis}>✕</button>
        ${abs(d, l.a) <= abs(d, l.de) ? `<span class="lim-err">La hora final tiene que ser después de la inicial.</span>` : ""}</div>`).join("") +
      `<button type="button" class="add" data-add="${esc(d.id)}" ${dis}>+ Añadir otro hueco</button></div>`;
  }
  return h + `<div class="err-msg">Elegid una opción para el ${esc(d.nombre.toLowerCase())}.</div></div>`;
}
function rerenderDay(id){ const d = S.config.dias.find(x => x.id === id), el = $("day-" + id); if(d && el){ el.outerHTML = dayHtml(d, canEdit() ? "" : "disabled"); } }
function bindForm(){
  const sec = $("sec-formulario"), f = S.form;
  [["fJ1","j1"],["fJ2","j2"],["fNotas","notas"]].forEach(([id,key]) => { const el = $(id); el.addEventListener("input", () => { f[key] = el.value; const fl = el.closest(".field"); if(fl) fl.classList.remove("invalid"); }); });
  sec.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => startEdit(b.dataset.edit, S.mine[b.dataset.edit]));
  const box = $("daysBox");
  box.addEventListener("click", e => {
    const o = e.target.closest("[data-modo]"), add = e.target.closest("[data-add]"), rm = e.target.closest("[data-rm]");
    if(o){
      const id = o.dataset.day, d = S.config.dias.find(x => x.id === id), st = f.dias[id] = f.dias[id] || { modo:"", no:[] };
      st.modo = o.dataset.modo;
      if(st.modo === "limites" && !st.no.length){ const [a] = dayRange(d); st.no.push({ de:fromMin(a), a:fromMin(a + 120) }); }
      rerenderDay(id);
    } else if(add){
      const id = add.dataset.add, d = S.config.dias.find(x => x.id === id), st = f.dias[id], last = st.no[st.no.length - 1], [, b] = dayRange(d);
      const start = last ? Math.min(abs(d, last.a), b - STEP) : dayRange(d)[0];
      st.no.push({ de:fromMin(start), a:fromMin(Math.min(start + 120, b)) }); rerenderDay(id);
    } else if(rm){
      const id = rm.dataset.rm, st = f.dias[id]; st.no.splice(+rm.dataset.i, 1); if(!st.no.length) st.modo = "todo"; rerenderDay(id);
    }
  });
  box.addEventListener("change", e => {
    const s = e.target.closest("select[data-day]"); if(!s) return;
    f.dias[s.dataset.day].no[+s.dataset.i][s.dataset.k] = s.value; rerenderDay(s.dataset.day);
  });
  const ce = $("cancelEdit"); if(ce) ce.onclick = cancelEdit;
  const del = $("deleteBtn"); if(del) del.onclick = () => askDelete(S.editId);
  $("submitBtn").onclick = submit;
}
async function submit(){
  const f = S.form, j1 = f.j1.trim(), j2 = f.j2.trim();
  let ok = true;
  if(!j1){ $("fj1Field").classList.add("invalid"); ok = false; }
  if(!j2){ $("fj2Field").classList.add("invalid"); ok = false; }
  const dias = {};
  S.config.dias.forEach(d => {
    const st = f.dias[d.id], el = $("day-" + d.id);
    if(!st || !st.modo){ el.classList.add("invalid"); ok = false; return; }
    if(st.modo === "limites"){
      const no = st.no.filter(l => abs(d, l.a) > abs(d, l.de)).sort((x, y) => abs(d, x.de) - abs(d, y.de));
      if(no.length !== st.no.length){ ok = false; return; }
      dias[d.id] = { modo:"limites", no:no.map(l => ({ de:l.de, a:l.a })) };
    } else dias[d.id] = { modo:st.modo };
  });
  if(ok && S.config.dias.every(d => dias[d.id].modo === "nada")){ toast("Si no podéis ningún día, hablad con la organización.", true); return; }
  if(!ok){ const first = document.querySelector(".invalid, .lim-err"); if(first) first.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  const prev = S.editId ? (S.mine[S.editId] || S.respuestas[S.editId]) : null, now = Date.now();
  const data = { j1, j2, dias, notas:f.notas.trim(), creado:(prev && prev.creado) || now, actualizado:now };
  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Guardando…";
  try{
    const wasEdit = !!S.editId;
    const id = await withTimeout(backend.saveRespuesta(S.editId, data), 15000);
    if(!(S.org && !S.mine[id] && wasEdit)){ addMine(id); S.mine[id] = data; }
    S.done = { id, wasEdit, nombre:`${j1} – ${j2}`, data };
    S.editId = null; S.form = blankForm();
    history.replaceState(null, "", link());
    renderMain(); window.scrollTo({ top:0, behavior:"smooth" });
  }catch(e){
    btn.disabled = false; btn.textContent = S.editId ? "Guardar cambios" : "Enviar";
    toast("No se ha podido guardar: " + errText(e), true);
  }
}

function startEdit(id, p){
  if(!p){ toast("No encontramos esa respuesta (puede que se haya borrado).", true); return; }
  S.done = null; S.editId = id;
  const dias = {};
  S.config.dias.forEach(d => { const m = modeOf(p, d); if(m) dias[d.id] = { modo:m, no:limitsOf(p, d).map(l => ({ de:l.de, a:l.a })) }; });
  S.form = { j1:p.j1 || "", j2:p.j2 || "", dias, notas:p.notas || "" };
  history.replaceState(null, "", link({ editar:id }));
  setTab("formulario"); window.scrollTo({ top:0 });
}

/* Confirmaciones dentro de la página (el confirm() nativo falla en el navegador de WhatsApp) */
let confirmFn = null;
function ask(title, text, okLabel, fn){ $("confirmTitle").textContent = title; $("confirmText").textContent = text; $("confirmOk").textContent = okLabel; confirmFn = fn; $("confirmOverlay").classList.add("show"); }
$("confirmOk").onclick = () => { $("confirmOverlay").classList.remove("show"); const fn = confirmFn; confirmFn = null; if(fn) fn(); };
function askDelete(id){
  const p = S.mine[id] || S.respuestas[id]; if(!p) return;
  ask("¿Borrar la respuesta?", `Se borrará la disponibilidad de ${names(p)}. No se puede deshacer.`, "Sí, borrar", async () => {

    catch(e){ toast("No se ha podido borrar: " + errText(e), true); }
  });
}

/* ======================= Organización: respuestas ======================= */
/* Cruza cada respuesta con el listado de la organización por los nombres (sin tildes ni mayúsculas). */
function toks(s){ return norm(s).split(/[^a-z0-9]+/).filter(t => t.length > 2); }
function playerHit(name, hay){ const t = toks(name); if(!t.length) return false; const n = t.filter(x => hay.has(x)).length; return n >= Math.min(2, t.length); }
function matchAll(){
  const pares = Object.entries(S.parejas).map(([id,p]) => Object.assign({ id }, p)).sort((a,b) => (a.num||999) - (b.num||999));
  const resp = Object.entries(S.respuestas).map(([id,r]) => Object.assign({ id }, r)).sort((a,b) => (a.creado||0) - (b.creado||0));
  const byPair = {}, unmatched = [];
  resp.forEach(r => {
    const hay = new Set(toks(`${r.j1} ${r.j2}`));
    let best = null, bestS = 0;
    pares.forEach(p => { const s = [p.j1, p.j2].filter(n => n && playerHit(n, hay)).length; if(s > bestS){ best = p; bestS = s; } });
    if(best){ r.pareja = best; (byPair[best.id] = byPair[best.id] || []).push(r); } else unmatched.push(r);
  });
  resp.sort((a,b) => ((a.pareja && a.pareja.num) || 999) - ((b.pareja && b.pareja.num) || 999));
  return { pares, resp, byPair, unmatched };
}
function heatColor(n, max){ if(!n) return "#c9d1cb"; const t = max ? n / max : 0; return t > .66 ? "#1f9d63" : t > .33 ? "#2a6b45" : "#b9850a"; }
function renderRespuestas(){
  const sec = $("sec-respuestas");
  if(!S.orgLoaded){ sec.innerHTML = `<div class="card">Cargando respuestas…</div>`; return; }
  const { pares, resp, byPair, unmatched } = matchAll();
  const answered = pares.filter(p => byPair[p.id]).length, missing = pares.filter(p => !byPair[p.id]).length;
  let h = `<div class="card"><div class="form-head"><div><h2>${resp.length} respuesta${resp.length === 1 ? "" : "s"}</h2>
      <p class="sub" style="margin:2px 0 0">${pares.length ? `${answered} de ${pares.length} parejas del listado han respondido.` : "No hay listado de parejas cargado."} Solo lo ve la organización.</p></div>
      <button class="btn primary small" id="csvBtn" ${resp.length ? "" : "disabled"}>Descargar Excel (CSV)</button></div>
      ${pares.length ? `<div class="progress"><i style="width:${Math.round(100 * answered / pares.length)}%"></i></div>` : ""}</div>`;
  if(resp.length){
    h += `<h3 class="h3">Cuántas parejas pueden jugar a cada hora</h3><div class="cov">` + S.config.dias.map(d => {
      const [a, b] = dayRange(d), rows = [];
      for(let t = a; t < b; t += STEP){ const n = resp.filter(r => canPlay(r, d, t)).length; rows.push([t, n]); }
      return `<div class="covday"><h4>${esc(d.nombre)} ${esc(d.fecha)}</h4>` + rows.map(([t, n]) => `<div class="bar"><span class="t">${fromMin(t)}</span><span class="b"><i style="width:${resp.length ? Math.round(100 * n / resp.length) : 0}%;background:${heatColor(n, resp.length)}"></i></span><span class="n">${n}</span></div>`).join("") + `</div>`;
    }).join("") + `</div>`;
  }
  if(pares.length){
    h += `<h3 class="h3">Listado de parejas</h3><div class="card"><div class="form-head"><p class="sub" style="margin:0">Se cruza por nombre; si alguien lo escribió distinto, sale abajo como «sin cruzar».</p>
      ${missing ? `<a class="btn-wa" target="_blank" rel="noopener" href="${esc(wa(`Recordatorio 🏆 ${S.config.titulo}: si todavía no nos habéis dicho cuándo podéis jugar, es un minuto 👇\n${link()}`))}">Recordatorio al grupo</a>` : ""}</div>
      <div style="height:10px"></div><div class="lst">` +
      pares.map(p => { const rs = byPair[p.id]; return `<div class="li${rs ? " ok" : ""}"><span class="no">${p.num || "—"}</span><div>${esc(names(p))}${p.cabeza ? ` <small style="display:inline">· cabeza ${p.cabeza}</small>` : ""}
        <small>${rs ? `<span class="ok-t">✓ Respondida</span>${rs.length > 1 ? ` · ${rs.length} respuestas` : ""}` : `<span class="x-t">Falta</span>`}</small></div></div>`; }).join("") +
      `</div></div>`;
  }
  if(unmatched.length && pares.length) h += `<div class="banner warn">${unmatched.length} respuesta${unmatched.length === 1 ? "" : "s"} sin cruzar con el listado: ${unmatched.map(r => esc(names(r))).join(" · ")}.</div>`;
  if(resp.length){
    h += `<h3 class="h3">Respuestas</h3><div class="rcards">` + resp.map(r => `<div class="rcard">
      <div class="n">${r.pareja ? r.pareja.num + ". " : ""}${esc(names(r))}</div>
      ${r.pareja ? "" : `<span class="tag warn">Sin cruzar con el listado</span>`}
      <div class="d">${S.config.dias.map(d => `<b>${esc(d.nombre)}:</b> ${esc(dayText(r, d))}`).join("<br>")}</div>
      ${r.notas ? `<div class="notes">${esc(r.notas)}</div>` : ""}
      <div class="meta">${esc(fmtTs(r.actualizado))}</div>
      <div class="acts"><button class="btn ghost small" data-oedit="${esc(r.id)}">Modificar</button><button class="btn danger small" data-odel="${esc(r.id)}">Borrar</button></div></div>`).join("") + `</div>`;
  } else h += `<div class="card">Todavía no ha respondido nadie.</div>`;
  sec.innerHTML = h;
  const csv = $("csvBtn"); if(csv) csv.onclick = () => downloadCsv(matchAll().resp);
  sec.querySelectorAll("[data-oedit]").forEach(b => b.onclick = () => startEdit(b.dataset.oedit, S.respuestas[b.dataset.oedit]));
  sec.querySelectorAll("[data-odel]").forEach(b => b.onclick = () => askDelete(b.dataset.odel));
}
function downloadCsv(resp){
  const cell = v => { const s = String(v == null ? "" : v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const head = ["N.º listado","Jugador 1","Jugador 2"].concat(S.config.dias.map(d => d.nombre), ["Observaciones","Enviada"]);
  const rows = resp.map(r => [r.pareja ? r.pareja.num : "", r.j1, r.j2].concat(S.config.dias.map(d => dayText(r, d)), [r.notas || "", fmtTs(r.actualizado)]));
  const csv = "﻿" + [head].concat(rows).map(r => r.map(cell).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.download = `disponibilidad_frontenis_invierno_${todayIso()}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ======================= Organización: ajustes ======================= */
let draft = null;
function renderAjustes(){
  if(!draft) draft = JSON.parse(JSON.stringify(S.config));
  const d = draft, sec = $("sec-ajustes");
  sec.innerHTML = `
  <div class="card"><h2>Datos del torneo</h2><p class="sub">Se aplican al momento para todos.</p>
    ${S.configFromDb ? "" : `<div class="banner warn">Ahora se ven los valores por defecto del código. Al guardar quedarán en la base de datos.</div>`}
    <div class="field"><label>Título <span class="hint">(lo de después de «·» sale grande en la cabecera)</span></label><input type="text" id="cTitulo" maxlength="80" value="${esc(d.titulo)}"></div>
    <div class="row2">
      <div class="field"><label>Fechas</label><input type="text" id="cFechas" maxlength="60" value="${esc(d.fechas)}"></div>
      <div class="field"><label>Lugar</label><input type="text" id="cLugar" maxlength="60" value="${esc(d.lugar)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Plazas</label><input type="text" id="cPlazas" maxlength="10" value="${esc(d.plazas)}"></div>
      <div class="field"><label>Precio y qué incluye</label><div class="row2" style="gap:8px"><input type="text" id="cPrecio" maxlength="20" value="${esc(d.precio)}"><input type="text" id="cIncluye" maxlength="40" value="${esc(d.incluye)}"></div></div>
    </div>
    <div class="row2">
      <div class="field"><label>Plazo hasta <span class="hint">(incluido; vacío = sin límite)</span></label><input type="date" id="cLimite" value="${esc(d.fechaLimite)}"></div>
      <div class="field"><label class="switch" style="margin-top:30px"><input type="checkbox" id="cAbierta" ${d.abierta !== false ? "checked" : ""}> Se puede rellenar</label></div>
    </div>
    <div class="field"><label>Aviso para todos <span class="hint">(opcional, sale arriba)</span></label><input type="text" id="cAviso" maxlength="200" value="${esc(d.aviso)}"></div>
  </div>
  <div class="card"><h2>Días y horario de juego</h2><p class="sub">Las parejas eligen sus horas dentro de este horario, de ${STEP} en ${STEP} minutos. Si la hora final es menor que la inicial, se entiende que acaba de madrugada.</p>
    <div id="cDias">${d.dias.map((dia, i) => `
      <div class="cfg-day" data-i="${i}"><div class="row4">
        <div class="field" style="margin:0"><label>Día</label><input type="text" data-k="nombre" value="${esc(dia.nombre)}" placeholder="Sábado"></div>
        <div class="field" style="margin:0"><label>Fecha</label><input type="text" data-k="fecha" value="${esc(dia.fecha)}" placeholder="9 de enero"></div>
        <div class="field" style="margin:0"><label>Desde</label><input type="text" data-k="desde" value="${esc(dia.desde)}" placeholder="15:00"></div>
        <div class="field" style="margin:0"><label>Hasta</label><input type="text" data-k="hasta" value="${esc(dia.hasta)}" placeholder="02:00"></div>
        <button class="btn danger small" data-rmday="${i}">Quitar</button>
      </div></div>`).join("")}</div>
    <button class="btn ghost small" id="cAddDay">+ Añadir día</button>
  </div>
  <div class="actions"><button class="btn primary" id="cSave">Guardar ajustes</button><button class="btn ghost" id="cReset">Descartar cambios</button></div>`;
  const sync = () => {
    const v = id => $(id).value.trim();
    d.titulo = v("cTitulo"); d.fechas = v("cFechas"); d.lugar = v("cLugar"); d.plazas = v("cPlazas"); d.precio = v("cPrecio"); d.incluye = v("cIncluye");
    d.fechaLimite = $("cLimite").value; d.abierta = $("cAbierta").checked; d.aviso = v("cAviso");
    sec.querySelectorAll(".cfg-day").forEach(el => { const dia = d.dias[+el.dataset.i]; ["nombre","fecha","desde","hasta"].forEach(k => dia[k] = el.querySelector(`[data-k="${k}"]`).value.trim()); });
  };
  sec.querySelectorAll("[data-rmday]").forEach(b => b.onclick = () => { sync(); d.dias.splice(+b.dataset.rmday, 1); renderAjustes(); });
  $("cAddDay").onclick = () => { sync(); d.dias.push({ id: uid("d"), nombre:"", fecha:"", desde:"10:00", hasta:"22:00" }); renderAjustes(); };
  $("cReset").onclick = () => { draft = null; renderAjustes(); };
  $("cSave").onclick = async () => {
    sync();
    const hhmm = /^([01]\d|2[0-3]):(00|30)$/;
    if(d.dias.some(x => !x.nombre)){ toast("Pon nombre a todos los días.", true); return; }
    if(d.dias.some(x => !hhmm.test(x.desde) || !hhmm.test(x.hasta))){ toast("Las horas van como 15:00 o 15:30.", true); return; }
    try{ await withTimeout(backend.saveConfig(JSON.parse(JSON.stringify(d))), 15000); draft = null; toast("Ajustes guardados"); }
    catch(e){ toast("No se han podido guardar: " + errText(e), true); }
  };
}

/* ======================= Acceso organización (Google) ======================= */
$("orgBtn").onclick = async () => {
  try{ if(S.user) await backend.logout(); else await backend.login(); }
  catch(e){ toast("No se ha podido iniciar sesión: " + ((e && e.message) || e), true); }
};
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).classList.remove("show"));
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if(e.target === o) o.classList.remove("show"); }));
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if(!b) return; if(b.dataset.tab === "formulario" && S.tab === "formulario") S.done = null; setTab(b.dataset.tab); });

/* ======================= Arranque ======================= */
let backend;
try{
  if(DEMO) backend = makeLocal();
  else if(typeof firebase === "undefined") throw new Error("no se ha cargado Firebase");
  else backend = makeFirebase();
}catch(e){
  backend = null;
  $("globalBanner").innerHTML = `<div class="banner err"><b>No se ha podido conectar con la base de datos</b> (${esc(e.message)}). Revisa la conexión y recarga la página.</div>`;
}
let lastConfigJson = "";
if(backend){
  backend.onConnected(v => { S.connected = v; renderStatus(); });
  backend.onConfig(c => {
    const j = JSON.stringify(c || null), changed = j !== lastConfigJson; lastConfigJson = j;
    S.configFromDb = !!c; S.config = fillConfig(c);
    renderHero(); renderBanner();
    if(changed){
      if(S.tab === "formulario" && !S.done) renderMain();
      if(S.tab === "respuestas") renderRespuestas();
      if(S.tab === "ajustes"){ draft = null; renderAjustes(); }
    }
  }, () => {});
  backend.onAuth(u => {
    const wasOrg = S.org;
    S.user = u; S.org = !!u && ORG_EMAILS.includes(u.email);
    if(u && !S.org){ toast(`${u.email} no es una cuenta de la organización.`, true); backend.logout(); return; }
    if(S.org && !wasOrg){
      S.orgLoaded = false; S.orgError = null;
      backend.watchOrg(
        r => { S.respuestas = r; S.orgLoaded = true; renderHero(); if(S.tab === "respuestas") renderRespuestas(); },
        p => { S.parejas = p; if(S.tab === "respuestas") renderRespuestas(); },
        e => { S.orgError = e; S.orgLoaded = true; renderBanner(); if(S.tab === "respuestas") renderRespuestas(); });
      toast("Organización: " + u.email);
      if(!S.editId) setTab("respuestas");
    }
    if(!S.org && wasOrg){ backend.unwatchOrg(); S.respuestas = {}; S.parejas = {}; S.orgLoaded = false; setTab("formulario"); }
    renderOrgUi(); renderBanner(); renderHero();
  });
  /* Respuestas de este móvil y la del enlace ?editar=…, leídas una a una por su id */
  (async () => {
    const want = mineIds(), editar = params.get("editar");
    if(editar && !want.includes(editar)) want.unshift(editar);
    for(const id of want){
      try{ const p = await withTimeout(backend.getRespuesta(id), 10000); if(p) S.mine[id] = p; else delMine(id); }catch(e){}
    }
    if(editar && S.mine[editar]){ addMine(editar); startEdit(editar, S.mine[editar]); }
    else { if(editar) toast("No encontramos esa respuesta (puede que se haya borrado).", true); if(S.tab === "formulario" && !S.done && !S.editId) renderMain(); }
  })();
}

renderOrgUi(); renderHero(); renderBanner(); renderStatus(); setTab("formulario");
})();
</script>
